name: Publish Windows executable

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to build and upload
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build the self-contained executable
        shell: pwsh
        run: |
          dotnet publish src/FileOccupiedRelease.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish
      - name: Attach the executable to the existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release upload $env:RELEASE_TAG publish/FileOccupiedRelease.exe
